name: LLM Cost Check
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
  pull-requests: write
jobs:
  llm-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: AiGanak/llm-cost-action@v1.1.0
        with:
          path: mcp
