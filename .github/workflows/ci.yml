name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - name: Derived files match data/prices.json
        run: python scripts/build.py --check
      - name: Tests (schema, data sanity, calculator)
        run: python -m pytest -q

  mcp:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: MCP server tool checks (bundled data)
        run: node test.js

  js:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm package tests (bundled data matches data/prices.json)
        run: npm test
