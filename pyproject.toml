[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aiganak-llm-prices"
version = "2026.11.2"
description = "LLM API list prices for OpenAI, Anthropic and Google models, with a token cost calculator."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "AiGanak", email = "contact@aiganak.com" }]
keywords = ["llm", "pricing", "openai", "anthropic", "claude", "gemini", "tokens", "cost", "finops"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21"]

[project.scripts]
llm-prices = "llm_prices.__main__:main"

[project.urls]
Homepage = "https://aiganak.com/llm-api-pricing/"
Repository = "https://github.com/AiGanak/llm-prices"
Changelog = "https://github.com/AiGanak/llm-prices/blob/main/CHANGELOG.md"
"Price change log" = "https://aiganak.com/llm-price-changes/"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_prices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
